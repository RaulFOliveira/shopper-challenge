services:
  app:
    image: node:22 
    container_name: node_app
    working_dir: /app
    volumes:
      - .:/app
      - ~/.aws:/root/.aws
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    command: sh -c "./wait-for-it.sh postgres:5432 -- npx prisma generate && npx prisma db push && npm run start:dev"
    networks:
      - app-network

  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=johndoe
      - POSTGRES_PASSWORD=randompassword
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge